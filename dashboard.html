<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ダッシュボード | 我が家マネー</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="我が家マネー">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
  <main class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>

    <div id="content" style="display:none;">
      <h1 style="margin: 0 0 0.5rem; font-size: 1.5rem;">ダッシュボード</h1>
      <p style="color: var(--text-muted); margin: 0 0 1.5rem; font-size: 0.9rem;">
        <span id="household-greeting"></span>
      </p>

      <!-- メトリクスカード4枚 -->
      <div class="grid cols-4">
        <div class="card">
          <p class="card-title">総資産 (支払予定差引後)</p>
          <p class="card-value" id="metric-total">¥—</p>
          <p class="card-sub" id="metric-total-sub">前月比 —</p>
          <p class="card-sub" id="metric-total-breakdown" style="font-size: 0.72rem; opacity: 0.7; margin-top: 0.1rem;"></p>
        </div>
        <div class="card">
          <p class="card-title">目標額</p>
          <p class="card-value" id="metric-target">¥—</p>
          <p class="card-sub" id="metric-target-sub">設定画面から登録</p>
        </div>
        <div class="card">
          <p class="card-title">目標まで残額</p>
          <p class="card-value" id="metric-remaining">¥—</p>
          <p class="card-sub" id="metric-remaining-sub">—</p>
        </div>
        <div class="card">
          <p class="card-title">達成率</p>
          <p class="card-value" id="metric-progress">—</p>
          <div style="margin-top: 0.5rem;">
            <div class="progress"><div class="progress-bar" id="progress-bar" style="width: 0%;"></div></div>
          </div>
        </div>
      </div>

      <!-- 資産推移グラフ -->
      <h2 class="section-title">資産推移</h2>
      <div class="card">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
          <div style="font-size: 0.9rem; color: var(--text-muted);" id="chart-period-label">直近12ヶ月</div>
          <div style="display:flex; gap: 0.3rem;">
            <button class="btn btn-ghost btn-sm period-btn" data-months="6">6ヶ月</button>
            <button class="btn btn-ghost btn-sm period-btn active" data-months="12">1年</button>
            <button class="btn btn-ghost btn-sm period-btn" data-months="36">3年</button>
            <button class="btn btn-ghost btn-sm period-btn" data-months="0">全期間</button>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="asset-chart"></canvas>
        </div>
        <div id="asset-empty" class="empty-state" style="display:none;">
          <h3>まだ資産データがありません</h3>
          <p>過去のCSVを取り込むか、最初の残高を入力してみましょう</p>
          <div style="display:flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
            <a href="/import.html" class="btn btn-primary">CSVを取り込む</a>
            <a href="/monthly.html" class="btn btn-ghost">月次入力する</a>
          </div>
        </div>
      </div>

      <!-- サブカード -->
      <div class="grid cols-2" style="margin-top: 1rem;">
        <div class="card">
          <h3 style="margin: 0 0 0.5rem; font-size: 1rem;">資産構成 (最新月)</h3>
          <div class="chart-container" style="height: 280px;">
            <canvas id="composition-chart"></canvas>
          </div>
          <div id="composition-summary" style="margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.85rem; display: none;">
            <div style="display:flex; justify-content: space-between;">
              <span style="color: var(--text-muted);">資産合計</span>
              <span id="comp-total" style="font-variant-numeric: tabular-nums;">—</span>
            </div>
            <div style="display:flex; justify-content: space-between;" id="comp-expense-row">
              <span style="color: var(--text-muted);">支払予定</span>
              <span id="comp-expense" class="card-sub down" style="font-variant-numeric: tabular-nums;">—</span>
            </div>
            <div style="display:flex; justify-content: space-between; margin-top: 0.25rem; padding-top: 0.5rem; border-top: 1px dashed var(--border);">
              <span style="font-weight: 600;">純資産</span>
              <span id="comp-net" style="font-variant-numeric: tabular-nums; font-weight: 700;">—</span>
            </div>
          </div>
          <div id="composition-empty" class="empty-state" style="display:none; padding: 2rem 1rem;">
            <p>データが入ると表示されます</p>
          </div>
        </div>
        <div class="card">
          <h3 style="margin: 0 0 0.75rem; font-size: 1rem;">前年同月比</h3>
          <div id="yoy-comparison">
            <p style="color: var(--text-muted); padding: 2rem 1rem; text-align:center; margin:0;">データが揃ったら表示されます</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth } from '/js/supabase.js';
    import { renderNav } from '/js/nav.js';
    import { listAccounts, getAssetTrend } from '/js/api.js';
    import { formatYen, formatYenShort, formatPercent } from '/js/utils.js';

    const auth = await requireAuth();
    if (!auth) throw new Error('not authenticated');
    renderNav('/dashboard.html');

    document.getElementById('household-greeting').textContent =
      `${auth.profile.households.name} / ${auth.profile.display_name}さん`;

    const TARGET = auth.profile.households.target_total_amount; // null可
    const TYPE_LABELS = {
      bank: '預貯金', jp_stock: '日本株', foreign_stock: '外国株',
      mutual_fund: '投資信託', insurance: '保険', pension: '年金/共済', other: 'その他',
    };
    const TYPE_COLORS = {
      bank: '#3b82f6', jp_stock: '#ef4444', foreign_stock: '#f59e0b',
      mutual_fund: '#8b5cf6', insurance: '#10b981', pension: '#6366f1', other: '#94a3b8',
    };

    // データ取得
    const [accounts, trend] = await Promise.all([
      listAccounts({ includeInactive: true }),
      getAssetTrend(),
    ]);

    // datalabels プラグインを登録
    Chart.register(ChartDataLabels);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    // ============ 目標額カードの初期化 (データ有無に関わらず) ============
    function renderTargetCards(currentTotal) {
      const targetEl = document.getElementById('metric-target');
      const targetSubEl = document.getElementById('metric-target-sub');
      const remainEl = document.getElementById('metric-remaining');
      const remainSubEl = document.getElementById('metric-remaining-sub');
      const progEl = document.getElementById('metric-progress');
      const progBar = document.getElementById('progress-bar');

      if (TARGET == null || TARGET <= 0) {
        targetEl.textContent = '未設定';
        targetSubEl.textContent = '設定画面から登録';
        remainEl.textContent = '—';
        remainSubEl.textContent = '目標額を設定してください';
        progEl.textContent = '—';
        progBar.style.width = '0%';
        return;
      }
      targetEl.textContent = formatYen(TARGET);
      targetSubEl.textContent = formatYenShort(TARGET);

      const remaining = TARGET - currentTotal;
      remainEl.textContent = remaining > 0 ? formatYen(remaining) : '達成済 🎉';
      if (remaining > 0) {
        remainSubEl.textContent = `${formatYenShort(remaining)} 必要`;
        remainSubEl.classList.remove('up');
      } else {
        remainSubEl.textContent = `+${formatYenShort(-remaining)} 超過達成`;
        remainSubEl.classList.add('up');
      }

      const pct = currentTotal / TARGET * 100;
      const clampedPct = Math.min(100, Math.max(0, pct));
      progEl.textContent = `${pct.toFixed(1)}%`;
      progBar.style.width = `${clampedPct}%`;
      if (pct >= 100) progBar.style.background = 'var(--success)';
    }

    if (trend.length === 0) {
      // データなし状態
      document.getElementById('metric-total').textContent = '¥0';
      document.getElementById('metric-total-sub').textContent = 'データを取り込みましょう';
      renderTargetCards(0);
      document.getElementById('asset-empty').style.display = 'block';
      document.querySelector('#asset-chart').style.display = 'none';
      document.getElementById('composition-empty').style.display = 'block';
      document.querySelector('#composition-chart').style.display = 'none';
    } else {
      // メトリクス計算
      const latest = trend[trend.length - 1];
      const prev = trend.length >= 2 ? trend[trend.length - 2] : null;
      const latestYM = latest.date.slice(0, 7);
      const targetYM = `${parseInt(latestYM.slice(0,4),10) - 1}-${latestYM.slice(5)}`;
      const yearAgo = trend.find(t => t.date.slice(0, 7) === targetYM);

      // カード1: 総資産 (=net, 支払予定差引後)
      document.getElementById('metric-total').textContent = formatYen(latest.net);
      if (prev) {
        const diff = latest.net - prev.net;
        const pct = prev.net !== 0 ? (diff / prev.net) * 100 : 0;
        const sub = document.getElementById('metric-total-sub');
        sub.textContent = `前月比 ${diff >= 0 ? '+' : ''}${formatYenShort(diff)} (${formatPercent(pct)})`;
        sub.classList.add(diff >= 0 ? 'up' : 'down');
      } else {
        document.getElementById('metric-total-sub').textContent = '前月データなし';
      }
      // 内訳 (支出 > 0 のときだけ表示)
      const breakdown = document.getElementById('metric-total-breakdown');
      if (latest.expense > 0) {
        breakdown.textContent = `資産 ${formatYenShort(latest.total)} − 支払予定 ${formatYenShort(latest.expense)}`;
      } else {
        breakdown.textContent = '';
      }

      // カード2/3/4: 目標関連 — net 基準で計算
      renderTargetCards(latest.net);

      // ===== 資産推移グラフ =====
      const chartCtx = document.getElementById('asset-chart').getContext('2d');
      let chart = null;

      function renderChart(months) {
        const filtered = months > 0 ? trend.slice(-months) : trend;

        // 系列: account_type ごとのスタック
        const types = new Set();
        for (const t of filtered) for (const k of Object.keys(t.byType)) types.add(k);
        const typeOrder = ['bank', 'jp_stock', 'foreign_stock', 'mutual_fund', 'insurance', 'pension', 'other'].filter(t => types.has(t));

        // データラベルは点が多すぎると潰れるので、間引く
        const labelStep = Math.max(1, Math.ceil(filtered.length / 12)); // 最大12個まで表示
        const showLabel = (i) => i % labelStep === 0 || i === filtered.length - 1;

        const datasets = typeOrder.map((t, idx) => ({
          label: TYPE_LABELS[t] ?? t,
          data: filtered.map(d => d.byType[t] ?? 0),
          backgroundColor: TYPE_COLORS[t] + 'cc',
          borderColor: TYPE_COLORS[t],
          borderWidth: 1,
          fill: true,
          tension: 0.2,
          pointRadius: 0,
          pointHoverRadius: 4,
          datalabels: { display: false },
        }));

        // 支払予定がある月だけ「-¥X」を引き下げ表示するため、負の値の系列を別スタックで重ねる
        // (グラフ上でも「資産から下に伸びる支払予定」として可視化)
        const hasAnyExpense = filtered.some(d => d.expense > 0);
        if (hasAnyExpense) {
          datasets.push({
            label: '支払予定',
            data: filtered.map(d => -(d.expense ?? 0)),
            backgroundColor: 'rgba(220, 38, 38, 0.25)',
            borderColor: 'rgba(220, 38, 38, 0.7)',
            borderWidth: 1,
            fill: true,
            tension: 0,
            pointRadius: 0,
            pointHoverRadius: 4,
            datalabels: { display: false },
          });
        }

        // 「純資産」線(透明、データラベルだけ表示。位置は資産トップに置く)
        datasets.push({
          label: '純資産',
          data: filtered.map(d => d.total),  // 位置はスタックの天井 (資産合計)
          backgroundColor: 'transparent',
          borderColor: 'transparent',
          borderWidth: 0,
          fill: false,
          tension: 0,
          pointRadius: 0,
          pointHoverRadius: 0,
          stack: 'label-line',
          datalabels: {
            display: (ctx) => showLabel(ctx.dataIndex),
            anchor: 'end',
            align: 'top',
            offset: 4,
            color: '#111',
            font: { size: 10, weight: '600' },
            formatter: (_, ctx) => formatYenShort(filtered[ctx.dataIndex].net),
          },
        });

        if (chart) chart.destroy();
        chart = new Chart(chartCtx, {
          type: 'line',
          data: {
            labels: filtered.map(d => d.date.slice(0, 7)),
            datasets,
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            layout: { padding: { top: 24 } },
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  boxWidth: 12, padding: 10,
                  filter: (item) => item.text !== '純資産', // ラベル用ダミー線は凡例から隠す
                },
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    if (ctx.dataset.label === '支払予定') {
                      return `支払予定: -${formatYen(Math.abs(ctx.parsed.y ?? 0))}`;
                    }
                    return `${ctx.dataset.label}: ${formatYen(ctx.parsed.y)}`;
                  },
                  footer: (items) => {
                    const idx = items[0]?.dataIndex;
                    if (idx == null) return '';
                    const d = filtered[idx];
                    const lines = [`資産合計: ${formatYen(d.total)}`];
                    if (d.expense > 0) {
                      lines.push(`支払予定: -${formatYen(d.expense)}`);
                      lines.push(`純資産: ${formatYen(d.net)}`);
                    }
                    return lines;
                  },
                },
                filter: (ctx) => ctx.dataset.label !== '純資産',
              },
            },
            scales: {
              y: {
                stacked: true,
                ticks: { callback: (v) => formatYenShort(v) },
              },
              x: { stacked: true },
            },
          },
        });

        document.getElementById('chart-period-label').textContent = months > 0 ? `直近${months}ヶ月` : '全期間';
      }

      renderChart(12);

      // 期間切替
      document.querySelectorAll('.period-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderChart(parseInt(btn.dataset.months, 10));
        });
      });

      // ===== 資産構成 (最新月) ドーナツ =====
      // サマリー行 (資産 / 支払予定 / 純額)
      const compSummary = document.getElementById('composition-summary');
      compSummary.style.display = 'block';
      document.getElementById('comp-total').textContent = formatYen(latest.total);
      const compExpRow = document.getElementById('comp-expense-row');
      if (latest.expense > 0) {
        compExpRow.style.display = 'flex';
        document.getElementById('comp-expense').textContent = `-${formatYen(latest.expense)}`;
      } else {
        compExpRow.style.display = 'none';
      }
      document.getElementById('comp-net').textContent = formatYen(latest.net);

      const compCtx = document.getElementById('composition-chart').getContext('2d');
      const compTypes = Object.keys(latest.byType).filter(t => latest.byType[t] > 0);
      new Chart(compCtx, {
        type: 'doughnut',
        data: {
          labels: compTypes.map(t => TYPE_LABELS[t] ?? t),
          datasets: [{
            data: compTypes.map(t => latest.byType[t]),
            backgroundColor: compTypes.map(t => TYPE_COLORS[t] ?? '#999'),
            borderWidth: 2,
            borderColor: '#fff',
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 12, padding: 8, font: { size: 12 } } },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
                  const pct = total ? (ctx.parsed / total * 100).toFixed(1) : 0;
                  return `${ctx.label}: ${formatYen(ctx.parsed)} (${pct}%)`;
                },
              },
            },
            datalabels: {
              color: '#fff',
              font: { size: 11, weight: '700' },
              textShadowBlur: 4,
              textShadowColor: 'rgba(0,0,0,0.5)',
              formatter: (v, ctx) => {
                const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
                const pct = total ? (v / total * 100) : 0;
                if (pct < 4) return ''; // 4%未満はラベル省略
                return `${formatYenShort(v)}\n${pct.toFixed(0)}%`;
              },
              textAlign: 'center',
            },
          },
        },
      });

      // ===== 前年同月比 (net基準) =====
      if (yearAgo) {
        const yoyDiff = latest.net - yearAgo.net;
        const yoyPct = yearAgo.net !== 0 ? (yoyDiff / yearAgo.net) * 100 : 0;
        document.getElementById('yoy-comparison').innerHTML = `
          <div style="display: grid; gap: 0.5rem;">
            <div style="display:flex; justify-content: space-between;">
              <span style="color: var(--text-muted);">${yearAgo.date}</span>
              <span style="font-variant-numeric: tabular-nums;">${formatYen(yearAgo.net)}</span>
            </div>
            <div style="display:flex; justify-content: space-between;">
              <span style="color: var(--text-muted);">${latest.date}</span>
              <span style="font-variant-numeric: tabular-nums; font-weight:600;">${formatYen(latest.net)}</span>
            </div>
            <hr style="border:none; border-top:1px solid var(--border); margin: 0.5rem 0;">
            <div style="display:flex; justify-content: space-between;">
              <span>差額</span>
              <span class="${yoyDiff >= 0 ? 'card-sub up' : 'card-sub down'}" style="font-weight:600; font-variant-numeric: tabular-nums;">
                ${yoyDiff >= 0 ? '+' : ''}${formatYen(yoyDiff)} (${formatPercent(yoyPct)})
              </span>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
