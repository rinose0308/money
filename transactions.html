<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>支出 | 我が家マネー</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="container">
    <div id="loading" class="loading"><div class="spinner"></div><p>読み込み中...</p></div>
    <div id="content" style="display:none;">
      <h1 style="margin: 0 0 1rem; font-size: 1.5rem;">支出明細</h1>
      <div class="card empty-state">
        <h3>Phase 4 で実装予定</h3>
        <p>支出の一覧・フィルタ・編集はPhase 4で実装します。</p>
      </div>
    </div>
  </main>
  <script type="module">
    import { requireAuth } from '/js/supabase.js';
    import { renderNav } from '/js/nav.js';
    if (!await requireAuth()) throw new Error('not authenticated');
    renderNav('/transactions.html');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  </script>
</body>
</html>
