<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>月次入力 | 我が家マネー</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="container">
    <div id="loading" class="loading"><div class="spinner"></div><p>読み込み中...</p></div>
    <div id="content" style="display:none;">
      <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
        <h1 style="margin: 0; font-size: 1.5rem;">月次入力</h1>
        <div style="display:flex; gap: 0.4rem; align-items: center;">
          <button class="btn btn-ghost btn-sm" id="prev-month">‹ 前月</button>
          <input type="month" id="target-month" class="form-input" style="width: 160px; min-height: 36px;">
          <button class="btn btn-ghost btn-sm" id="next-month">次月 ›</button>
        </div>
      </div>

      <div id="loading-month" style="text-align:center; padding: 1rem;">
        <span class="spinner"></span> 既存データを読み込み中...
      </div>

      <div id="form-area" style="display:none;">
        <!-- 名義未登録時の警告 -->
        <div id="no-members-warn" class="card" style="display:none; background:#fef3c7; border-color:#fcd34d; margin-bottom: 1rem;">
          <strong>⚠️ 名義が未登録です</strong>
          <p style="margin: 0.5rem 0 0; font-size: 0.9rem;">
            <a href="/settings.html">設定画面</a>で名義(りょちょ・まちょなど)を登録すると、名義ごとに資産・収入・支出を分けて入力できます。
          </p>
        </div>

        <!-- 資産残高 -->
        <div class="card" style="margin-bottom: 1rem;">
          <h3 style="margin: 0 0 0.5rem; font-size: 1.05rem;">資産残高 (月末)</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0 0 0.75rem;">
            各口座について、名義ごとに月末残高を入力してください。空欄の名義は保存されません。
          </p>
          <div class="table-wrap" id="assets-table-wrap" style="display:none;">
            <table class="table">
              <thead id="assets-thead"></thead>
              <tbody id="assets-tbody"></tbody>
            </table>
          </div>
          <div id="assets-empty" class="empty-state" style="padding: 1rem; display:none;">
            <p style="margin: 0;">口座が未登録です</p>
            <a href="/settings.html" class="btn btn-primary btn-sm" style="margin-top: 0.5rem;">口座を追加</a>
          </div>
        </div>

        <!-- 収入 -->
        <div class="card" style="margin-bottom: 1rem;">
          <h3 style="margin: 0 0 0.5rem; font-size: 1.05rem;">収入</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0 0 0.75rem;">
            名義ごとに金額を入力してください(0円や空欄でもOK)。
          </p>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>名義</th>
                  <th>カテゴリ</th>
                  <th class="num">金額 (円)</th>
                  <th style="width:120px;"></th>
                </tr>
              </thead>
              <tbody id="income-tbody"></tbody>
            </table>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="add-income-btn" style="margin-top: 0.5rem;">＋ 収入を追加</button>
        </div>

        <!-- 支出 -->
        <div class="card" style="margin-bottom: 1rem;">
          <h3 style="margin: 0 0 0.5rem; font-size: 1.05rem;">支出 (名義ごとの月合計)</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0 0 0.75rem;">
            各名義の今月の合計支出額を入力してください。
          </p>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>名義</th>
                  <th class="num">月の合計支出 (円)</th>
                  <th style="width:90px;"></th>
                </tr>
              </thead>
              <tbody id="expense-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- 保存 -->
        <div style="display:flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;">
          <button type="button" class="btn btn-primary" id="save-all-btn">💾 この月をまとめて保存</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth } from '/js/supabase.js';
    import { renderNav } from '/js/nav.js';
    import {
      listAccounts, listSnapshots, replaceAccountMonthSnapshots, updateAccount,
      listMembers,
      listIncomes, replaceMonthlyIncomes,
      listMonthlyTransactions, replaceMonthlyTransactions,
      monthEndDate,
    } from '/js/api.js';
    import { formatYen, lastDayOfMonth, toast, withErrorToast } from '/js/utils.js';

    const auth = await requireAuth();
    if (!auth) throw new Error('not authenticated');
    renderNav('/monthly.html');

    const TYPE_LABELS = {
      bank: '預貯金', jp_stock: '日本株', foreign_stock: '外国株',
      mutual_fund: '投資信託', insurance: '保険', pension: '年金/共済', other: 'その他',
    };

    const DEFAULT_INCOME_CATEGORIES = ['給与', 'ボーナス', '副収入', 'その他'];

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
    }

    // =========== 月セレクター ===========
    const monthInput = document.getElementById('target-month');
    const now = new Date();
    monthInput.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    document.getElementById('prev-month').addEventListener('click', () => {
      const [y, m] = monthInput.value.split('-').map(Number);
      const d = new Date(y, m - 2, 1);
      monthInput.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      loadMonth();
    });
    document.getElementById('next-month').addEventListener('click', () => {
      const [y, m] = monthInput.value.split('-').map(Number);
      const d = new Date(y, m, 1);
      monthInput.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      loadMonth();
    });
    monthInput.addEventListener('change', loadMonth);

    // =========== ロード処理 ===========
    let accountsCache = [];
    let membersCache = [];
    let prevSnapMap = new Map();    // (account_id|member_key) => snapshot
    let prevIncomeMap = new Map();  // (earner_key|category) => income
    let prevExpenseMap = new Map(); // payer_key => total amount

    function prevMonthOf(year, month) {
      if (month === 1) return { year: year - 1, month: 12 };
      return { year, month: month - 1 };
    }

    async function loadMonth() {
      document.getElementById('form-area').style.display = 'none';
      document.getElementById('loading-month').style.display = 'block';

      const [y, m] = monthInput.value.split('-').map(Number);
      const dateStr = monthEndDate(y, m);
      const { year: py, month: pm } = prevMonthOf(y, m);
      const prevDateStr = monthEndDate(py, pm);

      [membersCache, accountsCache] = await Promise.all([
        listMembers(),
        listAccounts({ includeInactive: false }),
      ]);

      // 名義未登録時の警告
      document.getElementById('no-members-warn').style.display = membersCache.length === 0 ? 'block' : 'none';

      // 当月 + 前月 のデータを並列取得
      const [snaps, prevSnaps, incomes, prevIncomes, txs, prevTxs] = await Promise.all([
        listSnapshots({ fromDate: dateStr, toDate: dateStr }),
        listSnapshots({ fromDate: prevDateStr, toDate: prevDateStr }),
        listIncomes({ fromDate: dateStr, toDate: dateStr }),
        listIncomes({ fromDate: prevDateStr, toDate: prevDateStr }),
        listMonthlyTransactions({ fromDate: dateStr, toDate: dateStr }),
        listMonthlyTransactions({ fromDate: prevDateStr, toDate: prevDateStr }),
      ]);

      // 当月 snapshot Map
      const snapMap = new Map();
      for (const s of snaps) {
        snapMap.set(`${s.account_id}|${s.member_id ?? 'shared'}`, s);
      }
      // 前月 snapshot Map
      prevSnapMap = new Map();
      for (const s of prevSnaps) {
        prevSnapMap.set(`${s.account_id}|${s.member_id ?? 'shared'}`, s);
      }
      // 前月 income Map
      prevIncomeMap = new Map();
      for (const inc of prevIncomes) {
        prevIncomeMap.set(`${inc.earner_member_id ?? ''}|${inc.category}`, inc);
      }
      // 前月 expense Map (payer_member_id => 合計)
      prevExpenseMap = new Map();
      for (const tx of prevTxs) {
        const k = tx.payer_member_id ?? 'shared';
        prevExpenseMap.set(k, (prevExpenseMap.get(k) ?? 0) + Math.round(Number(tx.amount)));
      }

      renderAssetsMatrix(snapMap);
      renderIncomes(incomes);
      renderExpenses(txs);

      document.getElementById('loading-month').style.display = 'none';
      document.getElementById('form-area').style.display = 'block';
    }

    // ----- 資産: 口座 × 名義 のマトリクス入力 -----
    function renderAssetsMatrix(snapMap) {
      const wrap = document.getElementById('assets-table-wrap');
      const empty = document.getElementById('assets-empty');
      const thead = document.getElementById('assets-thead');
      const tbody = document.getElementById('assets-tbody');

      if (accountsCache.length === 0) {
        wrap.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      wrap.style.display = 'block';
      empty.style.display = 'none';

      const cols = membersCache.length === 0
        ? [{ id: null, name: '残高', color: '#94a3b8' }]
        : [...membersCache.map(m => ({ id: m.id, name: m.name, color: m.color })), { id: null, name: '共有', color: '#94a3b8' }];

      thead.innerHTML = `
        <tr>
          <th style="width:60px;">並替</th>
          <th>口座</th>
          <th>種別</th>
          ${cols.map(c => `
            <th class="num">
              <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${escapeHtml(c.color)}; vertical-align:middle; margin-right:0.3rem;"></span>
              ${escapeHtml(c.name)}
            </th>
          `).join('')}
          <th style="width:90px;"></th>
        </tr>
      `;

      tbody.innerHTML = '';
      accountsCache.forEach((acc, idx) => {
        const tr = document.createElement('tr');
        tr.classList.add('asset-row');
        tr.dataset.accountId = acc.id;

        const cells = cols.map(c => {
          const key = `${acc.id}|${c.id ?? 'shared'}`;
          const ex = snapMap.get(key);
          const v = ex ? Math.round(Number(ex.balance)) : '';
          return `
            <td class="num">
              <input type="number" inputmode="numeric"
                class="form-input asset-input"
                data-account-id="${acc.id}"
                data-member-id="${c.id ?? ''}"
                style="text-align:right; max-width: 160px;"
                value="${v}" placeholder="0">
            </td>
          `;
        }).join('');

        const isFirst = idx === 0;
        const isLast = idx === accountsCache.length - 1;
        tr.innerHTML = `
          <td>
            <div style="display:flex; flex-direction:column; gap:2px;">
              <button type="button" class="btn btn-ghost btn-sm move-up" data-id="${acc.id}" ${isFirst ? 'disabled' : ''} title="上へ" style="padding:0.1rem 0.4rem; min-height:auto; line-height:1;">▲</button>
              <button type="button" class="btn btn-ghost btn-sm move-down" data-id="${acc.id}" ${isLast ? 'disabled' : ''} title="下へ" style="padding:0.1rem 0.4rem; min-height:auto; line-height:1;">▼</button>
            </div>
          </td>
          <td><div style="font-weight:500;">${escapeHtml(acc.name)}</div></td>
          <td><span class="badge ${acc.account_type}">${TYPE_LABELS[acc.account_type] ?? acc.account_type}</span></td>
          ${cells}
          <td>
            <button type="button" class="btn btn-ghost btn-sm copy-prev-asset" data-id="${acc.id}" title="前月の値をコピー">前月</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll('.move-up').forEach(b => b.addEventListener('click', () => moveAccount(b.dataset.id, -1)));
      tbody.querySelectorAll('.move-down').forEach(b => b.addEventListener('click', () => moveAccount(b.dataset.id, +1)));
      tbody.querySelectorAll('.copy-prev-asset').forEach(b => b.addEventListener('click', () => copyPrevAsset(b.dataset.id)));
    }

    // 口座の並び替え (display_orderを書き換え)
    async function moveAccount(accountId, direction) {
      const idx = accountsCache.findIndex(a => a.id === accountId);
      if (idx < 0) return;
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= accountsCache.length) return;

      // メモリ上の並びを変更
      const reordered = [...accountsCache];
      [reordered[idx], reordered[newIdx]] = [reordered[newIdx], reordered[idx]];

      // 実際の入力値を保持しておく(再描画で消えないように)
      const inputValues = new Map();
      document.querySelectorAll('.asset-input').forEach(inp => {
        inputValues.set(`${inp.dataset.accountId}|${inp.dataset.memberId}`, inp.value);
      });

      // display_order を順番に書き換え (差があるものだけ)
      for (let i = 0; i < reordered.length; i++) {
        if (reordered[i].display_order !== i) {
          await updateAccount(reordered[i].id, { display_order: i });
          reordered[i].display_order = i;
        }
      }
      accountsCache = reordered;

      // 当月の snapshot は既に取得済みなので、それを再構築
      // (実際にはloadMonthでもう一度取り直すのが確実)
      await loadMonth();
      // 入力中の値を復元
      document.querySelectorAll('.asset-input').forEach(inp => {
        const k = `${inp.dataset.accountId}|${inp.dataset.memberId}`;
        if (inputValues.has(k) && inputValues.get(k) !== '') {
          inp.value = inputValues.get(k);
        }
      });
    }

    // 前月の残高をコピー (口座行ごと)
    function copyPrevAsset(accountId) {
      const tr = document.querySelector(`.asset-row[data-account-id="${accountId}"]`);
      if (!tr) return;
      let copied = 0;
      tr.querySelectorAll('.asset-input').forEach(inp => {
        const memberId = inp.dataset.memberId || null;
        const key = `${accountId}|${memberId ?? 'shared'}`;
        const prev = prevSnapMap.get(key);
        if (prev) {
          inp.value = Math.round(Number(prev.balance));
          copied++;
        }
      });
      if (copied === 0) toast('前月のデータがありません', 'warn');
    }

    // ----- 収入 -----
    function renderIncomes(incomes) {
      const tbody = document.getElementById('income-tbody');
      tbody.innerHTML = '';
      if (incomes.length === 0) {
        // デフォルト: 各メンバーに「給与」1行
        if (membersCache.length === 0) {
          addIncomeRow({ category: '給与', earner_member_id: null, amount: '' });
        } else {
          for (const m of membersCache) {
            addIncomeRow({ category: '給与', earner_member_id: m.id, amount: '' });
          }
        }
      } else {
        for (const inc of incomes) {
          addIncomeRow({
            category: inc.category,
            earner_member_id: inc.earner_member_id,
            amount: Math.round(Number(inc.amount)),
          });
        }
      }
    }

    function addIncomeRow({ category, earner_member_id, amount }) {
      const tr = document.createElement('tr');
      tr.classList.add('income-row');
      tr.innerHTML = `
        <td>
          <select class="form-select inc-earner" style="min-width: 130px;">
            <option value="">(共有)</option>
            ${membersCache.map(m => `<option value="${m.id}"${m.id===earner_member_id?' selected':''}>${escapeHtml(m.name)}</option>`).join('')}
          </select>
        </td>
        <td>
          <select class="form-select inc-cat" style="min-width: 120px;">
            ${DEFAULT_INCOME_CATEGORIES.map(c => `<option value="${escapeHtml(c)}"${c===category?' selected':''}>${escapeHtml(c)}</option>`).join('')}
          </select>
        </td>
        <td class="num"><input type="number" inputmode="numeric" class="form-input inc-amount" style="text-align:right; max-width: 200px;" value="${amount ?? ''}" placeholder="0"></td>
        <td style="display:flex; gap:0.3rem;">
          <button type="button" class="btn btn-ghost btn-sm copy-prev-income" title="前月の値をコピー">前月</button>
          <button type="button" class="btn btn-ghost btn-sm row-del" title="削除">✕</button>
        </td>
      `;
      tr.querySelector('.row-del').addEventListener('click', () => tr.remove());
      tr.querySelector('.copy-prev-income').addEventListener('click', () => copyPrevIncome(tr));
      document.getElementById('income-tbody').appendChild(tr);
    }

    function copyPrevIncome(tr) {
      const earner = tr.querySelector('.inc-earner').value || '';
      const category = tr.querySelector('.inc-cat').value;
      const key = `${earner}|${category}`;
      const prev = prevIncomeMap.get(key);
      if (prev) {
        tr.querySelector('.inc-amount').value = Math.round(Number(prev.amount));
      } else {
        toast('前月のデータがありません', 'warn');
      }
    }

    document.getElementById('add-income-btn').addEventListener('click', () => addIncomeRow({ category: '給与', earner_member_id: null, amount: '' }));

    // ----- 支出 -----
    function renderExpenses(txs) {
      const tbody = document.getElementById('expense-tbody');
      tbody.innerHTML = '';
      // 既存の payer_member_id ごとの合計
      const totalByMember = new Map(); // member_id (or 'shared') => amount
      for (const tx of txs) {
        const k = tx.payer_member_id ?? 'shared';
        if (!totalByMember.has(k)) totalByMember.set(k, 0);
        totalByMember.set(k, totalByMember.get(k) + Math.round(Number(tx.amount)));
      }

      // 各メンバー + 共有
      const targets = membersCache.length > 0
        ? [...membersCache.map(m => ({ id: m.id, name: m.name, color: m.color })), { id: null, name: '共有', color: '#94a3b8' }]
        : [{ id: null, name: '合計', color: '#94a3b8' }];

      for (const t of targets) {
        const k = t.id ?? 'shared';
        const amount = totalByMember.get(k) ?? '';
        const tr = document.createElement('tr');
        tr.classList.add('expense-row');
        tr.dataset.memberId = t.id ?? '';
        tr.dataset.payerKey = k;
        tr.innerHTML = `
          <td>
            <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${escapeHtml(t.color || '#94a3b8')}; vertical-align:middle; margin-right:0.4rem;"></span>
            ${escapeHtml(t.name)}
          </td>
          <td class="num">
            <input type="number" inputmode="numeric" class="form-input exp-amount" style="text-align:right; max-width: 200px;" value="${amount}" placeholder="0">
          </td>
          <td>
            <button type="button" class="btn btn-ghost btn-sm copy-prev-expense" title="前月の値をコピー">前月</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
      // 前月コピーボタン
      tbody.querySelectorAll('.copy-prev-expense').forEach(b => {
        b.addEventListener('click', () => {
          const tr = b.closest('tr');
          const key = tr.dataset.payerKey;
          const prevAmount = prevExpenseMap.get(key);
          if (prevAmount != null) {
            tr.querySelector('.exp-amount').value = prevAmount;
          } else {
            toast('前月のデータがありません', 'warn');
          }
        });
      });
    }

    // =========== 保存 ===========
    document.getElementById('save-all-btn').addEventListener('click', withErrorToast(async () => {
      const [y, m] = monthInput.value.split('-').map(Number);
      const dateStr = monthEndDate(y, m);

      const btn = document.getElementById('save-all-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 保存中...';

      try {
        // 1. 資産: 各口座について「その月の全スナップショットを置換」
        let assetAccountsSaved = 0;
        let assetCellsSaved = 0;
        const accountsToProcess = new Set();
        // 入力のあった行を抽出
        const perAccountRows = new Map(); // account_id => [{ member_id, balance }]
        document.querySelectorAll('.asset-row').forEach(tr => {
          const accountId = tr.dataset.accountId;
          const inputs = tr.querySelectorAll('.asset-input');
          let anyEntered = false;
          const rows = [];
          inputs.forEach(inp => {
            const v = inp.value.trim();
            if (!v) return;
            const balance = parseInt(v, 10);
            if (isNaN(balance)) return;
            anyEntered = true;
            const memberId = inp.dataset.memberId || null;
            rows.push({ member_id: memberId, balance });
          });
          // この口座について何か入力があった場合のみ「置換」処理
          if (anyEntered) {
            perAccountRows.set(accountId, rows);
            assetCellsSaved += rows.length;
          }
        });
        for (const [accountId, rows] of perAccountRows) {
          await replaceAccountMonthSnapshots({
            account_id: accountId,
            year: y,
            month: m,
            rows,
          });
          assetAccountsSaved++;
        }

        // 2. 収入 (delete-then-insert)
        const incomeRows = [];
        document.querySelectorAll('.income-row').forEach(tr => {
          const earner = tr.querySelector('.inc-earner').value || null;
          const category = tr.querySelector('.inc-cat').value;
          const amountStr = tr.querySelector('.inc-amount').value.trim();
          if (!amountStr) return;
          const amount = parseInt(amountStr, 10);
          if (isNaN(amount) || amount <= 0) return;
          incomeRows.push({ earner_member_id: earner, amount, category });
        });
        await replaceMonthlyIncomes({ year: y, month: m, rows: incomeRows });

        // 3. 支出 (delete-then-insert, 名義ごとの合計を1件ずつ)
        const expenseRows = [];
        document.querySelectorAll('.expense-row').forEach(tr => {
          const memberId = tr.dataset.memberId || null;
          const amountStr = tr.querySelector('.exp-amount').value.trim();
          if (!amountStr) return;
          const amount = parseInt(amountStr, 10);
          if (isNaN(amount) || amount <= 0) return;
          expenseRows.push({ category: 'total', amount, payer_member_id: memberId, description: '月合計' });
        });
        await replaceMonthlyTransactions({ year: y, month: m, rows: expenseRows });

        toast(`資産${assetAccountsSaved}口座(${assetCellsSaved}件) / 収入${incomeRows.length}件 / 支出${expenseRows.length}件 を保存しました`, 'success');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '💾 この月をまとめて保存';
      }
    }));

    // 初回ロード
    await loadMonth();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  </script>
</body>
</html>
