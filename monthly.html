<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>月次入力 | 我が家マネー</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="我が家マネー">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
  <main class="container">
    <div id="loading" class="loading"><div class="spinner"></div><p>読み込み中...</p></div>
    <div id="content" style="display:none;">
      <!-- 常時表示の sticky ツールバー -->
      <div class="sticky-toolbar">
        <div style="display:flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;">
          <h1>月次入力</h1>
          <button class="btn btn-ghost btn-sm" id="prev-month" title="前月" aria-label="前月">‹</button>
          <input type="month" id="target-month" class="form-input" style="width: 150px; min-height: 36px;">
          <button class="btn btn-ghost btn-sm" id="next-month" title="次月" aria-label="次月">›</button>
        </div>
        <button type="button" class="btn btn-primary" id="save-all-btn">💾 保存</button>
      </div>

      <div id="loading-month" style="text-align:center; padding: 1rem;">
        <span class="spinner"></span> 既存データを読み込み中...
      </div>

      <div id="form-area" style="display:none;">
        <!-- 名義未登録時の警告 -->
        <div id="no-members-warn" class="card" style="display:none; background:#fef3c7; border-color:#fcd34d; margin-bottom: 1rem;">
          <strong>⚠️ 名義が未登録です</strong>
          <p style="margin: 0.5rem 0 0; font-size: 0.9rem;">
            <a href="/settings.html">設定画面</a>で名義(りょちょ・まちょなど)を登録すると、名義ごとに資産・収入・支出を分けて入力できます。
          </p>
        </div>

        <!-- 資産残高 -->
        <div class="card" style="margin-bottom: 1rem;">
          <h3 style="margin: 0 0 0.5rem; font-size: 1.05rem;">資産残高 (月末)</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0 0 0.75rem;">
            ⋮⋮を掴んで並び替え。外貨口座は外貨額×レート。<a href="/settings.html">設定</a>で口座を追加・編集できます。
          </p>
          <div class="table-wrap" id="assets-table-wrap" style="display:none;">
            <table class="table stacked-mobile">
              <thead id="assets-thead"></thead>
              <tbody id="assets-tbody"></tbody>
            </table>
          </div>
          <div id="assets-empty" class="empty-state" style="padding: 1rem; display:none;">
            <p style="margin: 0;">口座が未登録です</p>
            <a href="/settings.html" class="btn btn-primary btn-sm" style="margin-top: 0.5rem;">口座を追加</a>
          </div>
        </div>

        <!-- 収入 -->
        <div class="card" style="margin-bottom: 1rem;">
          <h3 style="margin: 0 0 0.5rem; font-size: 1.05rem;">収入</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0 0 0.75rem;">
            名義ごとに金額を入力してください(0円や空欄でもOK)。
          </p>
          <div class="table-wrap">
            <table class="table stacked-mobile">
              <thead>
                <tr>
                  <th>名義</th>
                  <th>カテゴリ</th>
                  <th class="num">金額 (円)</th>
                  <th style="width:120px;"></th>
                </tr>
              </thead>
              <tbody id="income-tbody"></tbody>
            </table>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="add-income-btn" style="margin-top: 0.5rem;">＋ 収入を追加</button>
        </div>

        <!-- 支出 -->
        <div class="card" style="margin-bottom: 1rem;">
          <div style="display:flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
            <h3 style="margin: 0; font-size: 1.05rem;">支出</h3>
            <button type="button" class="btn btn-ghost btn-sm" id="add-expense-btn">＋ 行を追加</button>
          </div>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0.5rem 0 0.75rem;">
            <a href="/settings.html">支出カテゴリ</a>を登録すると、デフォルトで全カテゴリの行が出ます。
          </p>
          <div class="table-wrap">
            <table class="table stacked-mobile">
              <thead>
                <tr>
                  <th>名義</th>
                  <th>カテゴリ</th>
                  <th class="num">金額 (円)</th>
                  <th style="width:120px;"></th>
                </tr>
              </thead>
              <tbody id="expense-tbody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth } from '/js/supabase.js';
    import { renderNav } from '/js/nav.js';
    import {
      listAccounts, listSnapshots, replaceAccountMonthSnapshots, updateAccount,
      listMembers,
      listIncomes, replaceMonthlyIncomes,
      listMonthlyTransactions, replaceMonthlyTransactions,
      listExpenseCategories,
      monthEndDate,
    } from '/js/api.js';
    import { formatYen, formatYenShort, lastDayOfMonth, toast, withErrorToast } from '/js/utils.js';

    const auth = await requireAuth();
    if (!auth) throw new Error('not authenticated');
    renderNav('/monthly.html');

    const TYPE_LABELS = {
      bank: '預貯金', jp_stock: '日本株', foreign_stock: '外国株',
      mutual_fund: '投資信託', insurance: '保険', pension: '年金/共済', other: 'その他',
    };
    const DEFAULT_INCOME_CATEGORIES = ['給与', 'ボーナス', '副収入', 'その他'];
    // 含み益を入力できる口座種別 (預貯金などには不要)
    const PNL_TYPES = new Set(['jp_stock', 'foreign_stock', 'mutual_fund']);
    const hasPnl = (acc) => PNL_TYPES.has(acc.account_type);

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
    }

    // =========== 月セレクター + Dirty 追跡 ===========
    const monthInput = document.getElementById('target-month');
    const now = new Date();
    monthInput.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    // dirty: 未保存の変更があるかどうか
    let dirty = false;
    let currentMonthValue = monthInput.value;
    const saveBtn = () => document.getElementById('save-all-btn');

    function markDirty() {
      if (dirty) return;
      dirty = true;
      saveBtn().classList.add('btn-dirty');
    }
    function clearDirty() {
      dirty = false;
      saveBtn().classList.remove('btn-dirty');
    }

    // 月変更時の確認 (未保存ありなら confirm、キャンセルなら戻す)
    async function changeMonth(newValue) {
      if (newValue === currentMonthValue) return;
      if (dirty && !confirm('未保存の変更があります。破棄して別の月に移動しますか?')) {
        monthInput.value = currentMonthValue;
        return;
      }
      monthInput.value = newValue;
      await loadMonth();
      currentMonthValue = monthInput.value;
      clearDirty();
    }

    document.getElementById('prev-month').addEventListener('click', () => {
      const [y, m] = monthInput.value.split('-').map(Number);
      const d = new Date(y, m - 2, 1);
      changeMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    });
    document.getElementById('next-month').addEventListener('click', () => {
      const [y, m] = monthInput.value.split('-').map(Number);
      const d = new Date(y, m, 1);
      changeMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    });
    monthInput.addEventListener('change', () => {
      changeMonth(monthInput.value);
    });

    // フォーム内のあらゆる input/change を捕捉して dirty マーク
    const formArea = document.getElementById('form-area');
    formArea.addEventListener('input', markDirty);
    formArea.addEventListener('change', markDirty);

    // タブを閉じる/リロード/別ナビゲーションへ移動の前に確認
    window.addEventListener('beforeunload', (e) => {
      if (!dirty) return;
      e.preventDefault();
      e.returnValue = '';
    });

    // =========== ロード処理 ===========
    let accountsCache = [];
    let membersCache = [];
    let expcatCache = [];
    let prevSnapMap = new Map();
    let prevIncomeMap = new Map();
    let prevExpenseMap = new Map();   // (payer_key|category) => amount
    let assetCols = [];

    function prevMonthOf(year, month) {
      if (month === 1) return { year: year - 1, month: 12 };
      return { year, month: month - 1 };
    }

    async function loadMonth() {
      document.getElementById('form-area').style.display = 'none';
      document.getElementById('loading-month').style.display = 'block';

      const [y, m] = monthInput.value.split('-').map(Number);
      const dateStr = monthEndDate(y, m);
      const { year: py, month: pm } = prevMonthOf(y, m);
      const prevDateStr = monthEndDate(py, pm);

      [membersCache, accountsCache, expcatCache] = await Promise.all([
        listMembers(),
        listAccounts({ includeInactive: false }),
        listExpenseCategories(),
      ]);

      document.getElementById('no-members-warn').style.display = membersCache.length === 0 ? 'block' : 'none';

      const [snaps, prevSnaps, incomes, prevIncomes, txs, prevTxs] = await Promise.all([
        listSnapshots({ fromDate: dateStr, toDate: dateStr }),
        listSnapshots({ fromDate: prevDateStr, toDate: prevDateStr }),
        listIncomes({ fromDate: dateStr, toDate: dateStr }),
        listIncomes({ fromDate: prevDateStr, toDate: prevDateStr }),
        listMonthlyTransactions({ fromDate: dateStr, toDate: dateStr }),
        listMonthlyTransactions({ fromDate: prevDateStr, toDate: prevDateStr }),
      ]);

      const snapMap = new Map();
      for (const s of snaps) snapMap.set(`${s.account_id}|${s.member_id ?? 'shared'}`, s);
      prevSnapMap = new Map();
      for (const s of prevSnaps) prevSnapMap.set(`${s.account_id}|${s.member_id ?? 'shared'}`, s);
      prevIncomeMap = new Map();
      for (const inc of prevIncomes) prevIncomeMap.set(`${inc.earner_member_id ?? ''}|${inc.category}`, inc);
      prevExpenseMap = new Map();
      for (const tx of prevTxs) {
        const k = `${tx.payer_member_id ?? 'shared'}|${tx.category}`;
        prevExpenseMap.set(k, (prevExpenseMap.get(k) ?? 0) + Math.round(Number(tx.amount)));
      }

      assetCols = membersCache.length === 0
        ? [{ id: null, name: '残高', color: '#94a3b8' }]
        : [...membersCache.map(m => ({ id: m.id, name: m.name, color: m.color })), { id: null, name: '共有', color: '#94a3b8' }];

      renderAssetsMatrix(snapMap);
      renderIncomes(incomes);
      renderExpenses(txs);

      document.getElementById('loading-month').style.display = 'none';
      document.getElementById('form-area').style.display = 'block';
    }

    // ----- 資産: 口座 × 名義 のマトリクス入力 -----
    function renderAssetsMatrix(snapMap) {
      const wrap = document.getElementById('assets-table-wrap');
      const empty = document.getElementById('assets-empty');
      const thead = document.getElementById('assets-thead');
      const tbody = document.getElementById('assets-tbody');

      if (accountsCache.length === 0) {
        wrap.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      wrap.style.display = 'block';
      empty.style.display = 'none';

      thead.innerHTML = `
        <tr>
          <th style="width:30px;"></th>
          <th>口座</th>
          <th>種別</th>
          <th class="num" style="width:120px;">レート</th>
          ${assetCols.map(c => `
            <th class="num">
              <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${escapeHtml(c.color)}; vertical-align:middle; margin-right:0.3rem;"></span>
              ${escapeHtml(c.name)}
            </th>
          `).join('')}
          <th style="width:80px;"></th>
        </tr>
      `;

      tbody.innerHTML = '';
      for (const acc of accountsCache) {
        const tr = document.createElement('tr');
        tr.classList.add('asset-row');
        tr.dataset.accountId = acc.id;
        tr.dataset.foreign = acc.is_foreign_currency ? '1' : '0';

        // レート列 (外貨のみ表示。共通レートをこの行で持つ)
        const sharedRate = (() => {
          // この口座について、当月の最初に見つかったsnapshotのrateを使う
          for (const c of assetCols) {
            const k = `${acc.id}|${c.id ?? 'shared'}`;
            const ex = snapMap.get(k);
            if (ex && ex.exchange_rate != null) return Number(ex.exchange_rate);
          }
          return '';
        })();
        const rateCell = acc.is_foreign_currency
          ? `<td class="num fx-rate-cell" data-label="レート"><input type="number" step="0.0001" inputmode="decimal" class="form-input fx-rate" data-account-id="${acc.id}" style="text-align:right; max-width: 110px;" value="${sharedRate || ''}" placeholder="例: 150"></td>`
          : `<td class="num mob-hide" style="color: var(--text-muted);">—</td>`;

        const cells = assetCols.map(c => {
          const key = `${acc.id}|${c.id ?? 'shared'}`;
          const ex = snapMap.get(key);
          if (acc.is_foreign_currency) {
            const fa = ex?.foreign_amount != null ? Number(ex.foreign_amount) : '';
            const calcInit = (fa !== '' && sharedRate !== '') ? Math.round(fa * sharedRate) : null;
            const fxPnl = ex?.unrealized_pnl != null ? Math.round(Number(ex.unrealized_pnl)) : '';
            // 外貨でも投資性なら含み益(円換算後)を入力できる
            const fxPnlInput = hasPnl(acc) ? `
                  <input type="number" inputmode="numeric"
                    class="form-input fx-input pnl-input"
                    data-account-id="${acc.id}" data-member-id="${c.id ?? ''}"
                    style="margin-top:2px; font-size:0.8rem; padding:0.25rem 0.5rem;"
                    value="${fxPnl}" placeholder="含み益(円)" title="含み益(円換算)">` : '';
            return `
              <td class="num" data-label="${escapeHtml(c.name)}">
                <div class="fx-cell">
                  <input type="number" step="0.0001" inputmode="decimal"
                    class="form-input fx-input fx-amount"
                    data-account-id="${acc.id}" data-member-id="${c.id ?? ''}"
                    value="${fa}" placeholder="外貨額">
                  <span class="fx-result" data-result-for="${acc.id}|${c.id ?? 'shared'}">${calcInit != null ? '= ' + formatYen(calcInit) : ''}</span>${fxPnlInput}
                </div>
              </td>
            `;
          } else {
            const v = ex ? Math.round(Number(ex.balance)) : '';
            const pnl = ex?.unrealized_pnl != null ? Math.round(Number(ex.unrealized_pnl)) : '';
            // 投資性の口座は「評価額 + 含み益」の2段入力
            const pnlInput = hasPnl(acc) ? `
                <input type="number" inputmode="numeric"
                  class="form-input pnl-input"
                  data-account-id="${acc.id}" data-member-id="${c.id ?? ''}"
                  style="text-align:right; max-width: 160px; margin-top:2px; font-size:0.8rem; padding:0.25rem 0.5rem;"
                  value="${pnl}" placeholder="含み益" title="含み益(評価額のうち増えた分)">` : '';
            return `
              <td class="num" data-label="${escapeHtml(c.name)}">
                <input type="number" inputmode="numeric"
                  class="form-input asset-input"
                  data-account-id="${acc.id}" data-member-id="${c.id ?? ''}"
                  style="text-align:right; max-width: 160px;"
                  value="${v}" placeholder="評価額">${pnlInput}
              </td>
            `;
          }
        }).join('');

        const accLabel = acc.is_foreign_currency
          ? `<div style="font-weight:500;">${escapeHtml(acc.name)} <span class="badge" style="background:#fef3c7;color:#92400e;">${escapeHtml(acc.currency_code || 'FX')}</span></div>`
          : `<div style="font-weight:500;">${escapeHtml(acc.name)}</div>`;

        tr.innerHTML = `
          <td class="drag-cell"><span class="drag-handle" title="ドラッグで並び替え">⋮⋮</span></td>
          <td class="title-cell">${accLabel}</td>
          <td data-label="種別"><span class="badge ${acc.account_type}">${TYPE_LABELS[acc.account_type] ?? acc.account_type}</span></td>
          ${rateCell}
          ${cells}
          <td class="actions-cell"><button type="button" class="btn btn-ghost btn-sm copy-prev-asset" data-id="${acc.id}" title="前月の値をコピー">前月</button></td>
        `;
        tbody.appendChild(tr);
      }

      // 外貨の入力イベント (リアルタイム計算)
      tbody.querySelectorAll('.fx-amount, .fx-rate').forEach(inp => {
        inp.addEventListener('input', () => recalcFx(inp.dataset.accountId));
      });
      tbody.querySelectorAll('.copy-prev-asset').forEach(b => b.addEventListener('click', () => copyPrevAsset(b.dataset.id)));

      // D&D
      Sortable.create(tbody, {
        animation: 150,
        handle: '.drag-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        onEnd: withErrorToast(async (evt) => {
          if (evt.oldIndex === evt.newIndex) return;
          const moved = accountsCache.splice(evt.oldIndex, 1)[0];
          accountsCache.splice(evt.newIndex, 0, moved);
          // 入力中の値を保持
          const cached = new Map();
          tbody.querySelectorAll('.asset-input, .fx-amount, .fx-rate').forEach(inp => {
            const k = `${inp.dataset.accountId}|${inp.dataset.memberId ?? ''}|${inp.classList.contains('fx-rate') ? 'rate' : 'amount'}`;
            cached.set(k, inp.value);
          });
          for (let i = 0; i < accountsCache.length; i++) {
            if (accountsCache[i].display_order !== i) {
              await updateAccount(accountsCache[i].id, { display_order: i });
              accountsCache[i].display_order = i;
            }
          }
          // 値の復元(再描画なし、現在のDOMをそのまま使うので不要)
        }),
      });
    }

    function recalcFx(accountId) {
      const tr = document.querySelector(`.asset-row[data-account-id="${accountId}"]`);
      if (!tr) return;
      const rateInp = tr.querySelector('.fx-rate');
      const rate = rateInp ? parseFloat(rateInp.value) : NaN;
      tr.querySelectorAll('.fx-amount').forEach(inp => {
        const amt = parseFloat(inp.value);
        const memberKey = inp.dataset.memberId || 'shared';
        const result = tr.querySelector(`[data-result-for="${accountId}|${memberKey}"]`);
        if (!result) return;
        if (!isNaN(amt) && !isNaN(rate)) {
          result.textContent = '= ' + formatYen(Math.round(amt * rate));
        } else {
          result.textContent = '';
        }
      });
    }

    function copyPrevAsset(accountId) {
      const tr = document.querySelector(`.asset-row[data-account-id="${accountId}"]`);
      if (!tr) return;
      const isForeign = tr.dataset.foreign === '1';
      let copied = 0;

      if (isForeign) {
        let lastRate = null;
        tr.querySelectorAll('.fx-amount').forEach(inp => {
          const memberId = inp.dataset.memberId || null;
          const key = `${accountId}|${memberId ?? 'shared'}`;
          const prev = prevSnapMap.get(key);
          if (prev?.foreign_amount != null) {
            inp.value = Number(prev.foreign_amount);
            copied++;
          }
          if (prev?.exchange_rate != null) lastRate = Number(prev.exchange_rate);
        });
        const rateInp = tr.querySelector('.fx-rate');
        if (rateInp && lastRate != null) rateInp.value = lastRate;
        recalcFx(accountId);
      } else {
        tr.querySelectorAll('.asset-input').forEach(inp => {
          const memberId = inp.dataset.memberId || null;
          const key = `${accountId}|${memberId ?? 'shared'}`;
          const prev = prevSnapMap.get(key);
          if (prev) {
            inp.value = Math.round(Number(prev.balance));
            copied++;
          }
        });
      }
      // 含み益も前月から引き継ぐ
      tr.querySelectorAll('.pnl-input').forEach(inp => {
        const memberId = inp.dataset.memberId || null;
        const prev = prevSnapMap.get(`${accountId}|${memberId ?? 'shared'}`);
        if (prev?.unrealized_pnl != null) inp.value = Math.round(Number(prev.unrealized_pnl));
      });
      if (copied === 0) toast('前月のデータがありません', 'warn');
      else markDirty();
    }

    // ----- 収入 -----
    function renderIncomes(incomes) {
      const tbody = document.getElementById('income-tbody');
      tbody.innerHTML = '';
      if (incomes.length === 0) {
        if (membersCache.length === 0) {
          addIncomeRow({ category: '給与', earner_member_id: null, amount: '' });
        } else {
          for (const m of membersCache) {
            addIncomeRow({ category: '給与', earner_member_id: m.id, amount: '' });
          }
        }
      } else {
        for (const inc of incomes) {
          addIncomeRow({
            category: inc.category,
            earner_member_id: inc.earner_member_id,
            amount: Math.round(Number(inc.amount)),
          });
        }
      }
    }

    function addIncomeRow({ category, earner_member_id, amount }) {
      const tr = document.createElement('tr');
      tr.classList.add('income-row');
      tr.innerHTML = `
        <td data-label="名義">
          <select class="form-select inc-earner" style="min-width: 130px;">
            <option value="">(共有)</option>
            ${membersCache.map(m => `<option value="${m.id}"${m.id===earner_member_id?' selected':''}>${escapeHtml(m.name)}</option>`).join('')}
          </select>
        </td>
        <td data-label="カテゴリ">
          <select class="form-select inc-cat" style="min-width: 120px;">
            ${DEFAULT_INCOME_CATEGORIES.map(c => `<option value="${escapeHtml(c)}"${c===category?' selected':''}>${escapeHtml(c)}</option>`).join('')}
          </select>
        </td>
        <td class="num" data-label="金額"><input type="number" inputmode="numeric" class="form-input inc-amount" style="text-align:right; max-width: 200px;" value="${amount ?? ''}" placeholder="0"></td>
        <td class="actions-cell" style="display:flex; gap:0.3rem;">
          <button type="button" class="btn btn-ghost btn-sm copy-prev-income" title="前月の値をコピー">前月</button>
          <button type="button" class="btn btn-ghost btn-sm row-del" title="削除">✕</button>
        </td>
      `;
      tr.querySelector('.row-del').addEventListener('click', () => { tr.remove(); markDirty(); });
      tr.querySelector('.copy-prev-income').addEventListener('click', () => {
        const earner = tr.querySelector('.inc-earner').value || '';
        const cat = tr.querySelector('.inc-cat').value;
        const prev = prevIncomeMap.get(`${earner}|${cat}`);
        if (prev) { tr.querySelector('.inc-amount').value = Math.round(Number(prev.amount)); markDirty(); }
        else toast('前月のデータがありません', 'warn');
      });
      document.getElementById('income-tbody').appendChild(tr);
    }

    document.getElementById('add-income-btn').addEventListener('click', () => { addIncomeRow({ category: '給与', earner_member_id: null, amount: '' }); markDirty(); });

    // ----- 支出 -----
    function renderExpenses(txs) {
      const tbody = document.getElementById('expense-tbody');
      tbody.innerHTML = '';

      if (txs.length === 0) {
        // 既存データなし → デフォルト行: 各カテゴリに1行ずつ (名義は空)
        if (expcatCache.length === 0) {
          // フォールバック: 1行だけ (名義: 共有, カテゴリ: 合計)
          addExpenseRow({ category: '合計', payer_member_id: null, amount: '' });
        } else {
          for (const c of expcatCache) {
            addExpenseRow({ category: c.name, payer_member_id: null, amount: '' });
          }
        }
      } else {
        for (const tx of txs) {
          addExpenseRow({
            category: tx.category,
            payer_member_id: tx.payer_member_id,
            amount: Math.round(Number(tx.amount)),
          });
        }
      }
    }

    function addExpenseRow({ category, payer_member_id, amount }) {
      const tr = document.createElement('tr');
      tr.classList.add('expense-row');

      // カテゴリは expcatCache + 入力された値も含めて選べるように
      const catNames = new Set(expcatCache.map(c => c.name));
      if (category && !catNames.has(category)) catNames.add(category);
      const catOptions = Array.from(catNames).map(c => `<option value="${escapeHtml(c)}"${c===category?' selected':''}>${escapeHtml(c)}</option>`).join('');

      tr.innerHTML = `
        <td data-label="名義">
          <select class="form-select exp-payer" style="min-width: 130px;">
            <option value="">(共有)</option>
            ${membersCache.map(m => `<option value="${m.id}"${m.id===payer_member_id?' selected':''}>${escapeHtml(m.name)}</option>`).join('')}
          </select>
        </td>
        <td data-label="カテゴリ">
          <select class="form-select exp-cat" style="min-width: 130px;">
            ${catOptions || `<option value="${escapeHtml(category ?? '合計')}" selected>${escapeHtml(category ?? '合計')}</option>`}
          </select>
        </td>
        <td class="num" data-label="金額"><input type="number" inputmode="numeric" class="form-input exp-amount" style="text-align:right; max-width: 200px;" value="${amount ?? ''}" placeholder="0"></td>
        <td class="actions-cell" style="display:flex; gap:0.3rem;">
          <button type="button" class="btn btn-ghost btn-sm copy-prev-expense" title="前月の値をコピー">前月</button>
          <button type="button" class="btn btn-ghost btn-sm row-del" title="削除">✕</button>
        </td>
      `;
      tr.querySelector('.row-del').addEventListener('click', () => { tr.remove(); markDirty(); });
      tr.querySelector('.copy-prev-expense').addEventListener('click', () => {
        const payer = tr.querySelector('.exp-payer').value || 'shared';
        const cat = tr.querySelector('.exp-cat').value;
        const k = `${payer}|${cat}`;
        const prev = prevExpenseMap.get(k);
        if (prev != null) { tr.querySelector('.exp-amount').value = prev; markDirty(); }
        else toast('前月のデータがありません', 'warn');
      });
      document.getElementById('expense-tbody').appendChild(tr);
    }

    document.getElementById('add-expense-btn').addEventListener('click', () => {
      const defaultCat = expcatCache[0]?.name ?? '';
      addExpenseRow({ category: defaultCat, payer_member_id: null, amount: '' });
      markDirty();
    });

    // =========== 保存 ===========
    document.getElementById('save-all-btn').addEventListener('click', withErrorToast(async () => {
      const [y, m] = monthInput.value.split('-').map(Number);

      const btn = document.getElementById('save-all-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 保存中...';

      try {
        // 1. 資産: 各口座につき replace
        let assetAccountsSaved = 0;
        let assetCellsSaved = 0;
        const perAccount = new Map();

        document.querySelectorAll('.asset-row').forEach(tr => {
          const accountId = tr.dataset.accountId;
          const isForeign = tr.dataset.foreign === '1';
          const rows = [];
          let anyEntered = false;

          // その行の含み益入力を (memberId -> 値) で拾う
          const pnlByMember = new Map();
          tr.querySelectorAll('.pnl-input').forEach(inp => {
            const v = inp.value.trim();
            if (!v) return;
            const n = parseInt(v, 10);
            if (isNaN(n)) return;
            pnlByMember.set(inp.dataset.memberId || '', n);
          });

          if (isForeign) {
            const rateInp = tr.querySelector('.fx-rate');
            const rate = rateInp ? parseFloat(rateInp.value) : NaN;
            tr.querySelectorAll('.fx-amount').forEach(inp => {
              const v = inp.value.trim();
              if (!v) return;
              const fa = parseFloat(v);
              if (isNaN(fa)) return;
              if (isNaN(rate)) return; // レート未入力なら保存しない
              anyEntered = true;
              const memberId = inp.dataset.memberId || null;
              const balance = Math.round(fa * rate);
              rows.push({
                member_id: memberId, balance, foreign_amount: fa, exchange_rate: rate,
                unrealized_pnl: pnlByMember.has(inp.dataset.memberId || '') ? pnlByMember.get(inp.dataset.memberId || '') : null,
              });
            });
          } else {
            tr.querySelectorAll('.asset-input').forEach(inp => {
              const v = inp.value.trim();
              if (!v) return;
              const balance = parseInt(v, 10);
              if (isNaN(balance)) return;
              anyEntered = true;
              const memberId = inp.dataset.memberId || null;
              rows.push({
                member_id: memberId, balance,
                unrealized_pnl: pnlByMember.has(inp.dataset.memberId || '') ? pnlByMember.get(inp.dataset.memberId || '') : null,
              });
            });
          }
          if (anyEntered) {
            perAccount.set(accountId, rows);
            assetCellsSaved += rows.length;
          }
        });

        for (const [accountId, rows] of perAccount) {
          await replaceAccountMonthSnapshots({ account_id: accountId, year: y, month: m, rows });
          assetAccountsSaved++;
        }

        // 2. 収入
        const incomeRows = [];
        document.querySelectorAll('.income-row').forEach(tr => {
          const earner = tr.querySelector('.inc-earner').value || null;
          const category = tr.querySelector('.inc-cat').value;
          const amountStr = tr.querySelector('.inc-amount').value.trim();
          if (!amountStr) return;
          const amount = parseInt(amountStr, 10);
          if (isNaN(amount) || amount <= 0) return;
          incomeRows.push({ earner_member_id: earner, amount, category });
        });
        await replaceMonthlyIncomes({ year: y, month: m, rows: incomeRows });

        // 3. 支出 (カテゴリ × 名義 ごとに1行)
        const expenseRows = [];
        const seen = new Set();
        document.querySelectorAll('.expense-row').forEach(tr => {
          const memberId = tr.querySelector('.exp-payer').value || null;
          const category = tr.querySelector('.exp-cat').value || '合計';
          const amountStr = tr.querySelector('.exp-amount').value.trim();
          if (!amountStr) return;
          const amount = parseInt(amountStr, 10);
          if (isNaN(amount) || amount <= 0) return;
          const key = `${memberId ?? 'shared'}|${category}`;
          if (seen.has(key)) return; // 重複は最初のみ
          seen.add(key);
          expenseRows.push({ category, amount, payer_member_id: memberId, description: null });
        });
        await replaceMonthlyTransactions({ year: y, month: m, rows: expenseRows });

        toast(`資産${assetAccountsSaved}口座(${assetCellsSaved}件) / 収入${incomeRows.length}件 / 支出${expenseRows.length}件 を保存しました`, 'success');
        clearDirty();
      } finally {
        btn.disabled = false;
        btn.innerHTML = '💾 保存';
      }
    }));

    // 初回ロード
    await loadMonth();
    currentMonthValue = monthInput.value;
    clearDirty();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  </script>
</body>
</html>
