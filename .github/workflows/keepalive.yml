name: Supabase Keepalive

# 目的: Supabase無料プランは7日間アクセスがないと自動で一時停止される。
# 2日に1回、軽いクエリを投げて「使用中」状態を保ち、停止を防ぐ。
#
# 注意: GitHubは「リポジトリに60日間コミットが無い」と scheduled workflow を
# 自動で無効化する。普段から開発でpushしていれば問題ないが、長期間放置すると
# 止まる可能性がある。その場合はGitHubのActionsタブから手動で再有効化するか、
# 何かコミットを1つ入れればリセットされる。

on:
  schedule:
    # 2日に1回、UTC 15:00 (日本時間 翌0:00) に実行
    - cron: '0 15 */2 * *'
  # 手動実行も可能 (ActionsタブのRun workflowボタン)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          SUPABASE_URL="https://hcnkixmoybavgoewkhxa.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbmtpeG1veWJhdmdvZXdraHhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MTM4MTAsImV4cCI6MjA5Mjk4OTgxMH0.5UCw8AaZ0Xw-_fzk9YndoJgBFOd4OzUZnxWZst2KLLE"

          echo "Supabaseにキープアライブのクエリを送信..."
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/households?select=id&limit=1" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}")

          echo "HTTPステータス: ${HTTP_CODE}"

          # 200 (RLSで空配列が返る) なら成功。停止中なら 000/503 など。
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✅ Supabaseは稼働中。キープアライブ成功。"
          else
            echo "⚠️ 想定外のステータス (${HTTP_CODE})。プロジェクトが停止しているか、設定を確認してください。"
            exit 1
          fi
