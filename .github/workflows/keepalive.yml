name: Supabase Keepalive

# 目的:
# 1. Supabase無料プランは「1週間のあいだ十分なDBアクティビティがない」と自動で一時停止される。
#    公式ドキュメントの基準は "a few user requests to the database each day"。
#    以前は 1日1回・1クエリ だったため「不十分」と判定され警告メールが来た (2026-09)。
#    → 1日3回、毎回 複数テーブルにクエリを投げて、余裕を持って基準を超える。
# 2. それでも停止してしまった場合は、Management API で自動復旧 (Resume) する。
#    ※ 自動復旧には SUPABASE_ACCESS_TOKEN シークレットの登録が必要。
#       https://supabase.com/dashboard/account/tokens でトークンを発行し、
#       リポジトリの Settings > Secrets and variables > Actions に登録する。
# 3. GitHubは「リポジトリに60日間コミットが無い」と scheduled workflow を
#    無効化するため、1日1回 .keepalive に日付をコミットしてタイマーをリセットする。

on:
  schedule:
    # 1日3回 UTC 3:00 / 11:00 / 19:00 (日本時間 12:00 / 20:00 / 4:00)
    - cron: '0 3,11,19 * * *'
  # 手動実行も可能 (ActionsタブのRun workflowボタン)
  workflow_dispatch:

# 自動コミットのために書き込み権限が必要
permissions:
  contents: write

env:
  SUPABASE_URL: https://hcnkixmoybavgoewkhxa.supabase.co
  PROJECT_REF: hcnkixmoybavgoewkhxa
  ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbmtpeG1veWJhdmdvZXdraHhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MTM4MTAsImV4cCI6MjA5Mjk4OTgxMH0.5UCw8AaZ0Xw-_fzk9YndoJgBFOd4OzUZnxWZst2KLLE
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  ping:
    runs-on: ubuntu-latest
    # 復旧待ち(最大10分)を含めても20分で必ず終わらせる。
    # 2026-10-05 に一時的な通信失敗から復旧待ちループに入り、15分走って打ち切られた。
    timeout-minutes: 20
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Supabaseにアクティビティを発生させる (停止していたら自動復旧)
        run: |
          # 1テーブルに GET (select) を投げて HTTP ステータスを返す
          # (select=* にしているのは、主キー名がテーブルごとに違うため。RLS で中身は返らない)
          ping_table() {
            curl -sS -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/$1?select=*&limit=1" \
              -H "apikey: ${ANON_KEY}" \
              -H "Authorization: Bearer ${ANON_KEY}" \
              --max-time 20 2>/dev/null || echo "000"
          }
          # count クエリ (HEAD + Prefer: count=exact)。RLS で 0 件でも SELECT count(*) が DB で実行される
          count_table() {
            curl -sS -o /dev/null -w "%{http_code}" -I \
              "${SUPABASE_URL}/rest/v1/$1?select=*" \
              -H "apikey: ${ANON_KEY}" \
              -H "Authorization: Bearer ${ANON_KEY}" \
              -H "Prefer: count=exact" \
              --max-time 20 2>/dev/null || echo "000"
          }

          # 稼働判定のカナリア。
          # 1回の失敗で「停止した」と断定すると、ネットワークの一時的な不調でも
          # 復旧API呼び出し + 10分の待機ループに入ってしまう (2026-10-05 に発生)。
          # 15秒あけて3回試し、全部ダメなときだけ本当に停止とみなす。
          CODE=""
          for attempt in 1 2 3; do
            CODE=$(ping_table households)
            if [ "${CODE}" = "200" ]; then
              [ "${attempt}" != "1" ] && echo "カナリア households: ${attempt}回目で復帰 (HTTP 200)"
              break
            fi
            echo "カナリア households: ${attempt}/3 回目 HTTP ${CODE}"
            [ "${attempt}" != "3" ] && sleep 15
          done

          if [ "${CODE}" = "200" ]; then
            # 稼働中 → 複数テーブルに select + count を投げて「1日に数回」の基準を余裕で超える
            OK=1; TOTAL=1
            for t in household_members accounts asset_snapshots incomes transactions expense_categories life_plan_settings; do
              c1=$(ping_table "$t");  TOTAL=$((TOTAL+1)); [ "$c1" = "200" ] && OK=$((OK+1))
              c2=$(count_table "$t"); TOTAL=$((TOTAL+1)); [ "$c2" = "200" ] && OK=$((OK+1))
              echo "  ${t}: select ${c1} / count ${c2}"
            done
            echo "✅ Supabaseは稼働中。${OK}/${TOTAL} リクエスト成功。キープアライブ完了。"
            exit 0
          fi

          echo "⚠️ 応答がありません (HTTP ${CODE})。プロジェクトが一時停止している可能性があります。"

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN が未設定のため自動復旧できません。"
            echo "   1) https://supabase.com/dashboard/account/tokens でトークンを発行"
            echo "   2) リポジトリの Settings > Secrets and variables > Actions に"
            echo "      SUPABASE_ACCESS_TOKEN という名前で登録してください。"
            echo "   (応急処置: SupabaseダッシュボードでResume projectを押す)"
            exit 1
          fi

          echo "🔄 Management API で自動復旧 (Resume) を実行します..."
          RESTORE_CODE=$(curl -sS -o /tmp/restore_res.txt -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --max-time 30 || echo "000")
          echo "restore API: HTTP ${RESTORE_CODE}"
          cat /tmp/restore_res.txt || true

          # 最大10分間 (30秒 x 20回) 復旧を待つ
          for i in $(seq 1 20); do
            sleep 30
            CODE=$(ping_table households)
            echo "  復旧確認 ${i}/20: HTTP ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "✅ 自動復旧に成功しました。"
              exit 0
            fi
          done

          echo "❌ 10分待っても復旧を確認できませんでした。Supabaseダッシュボードを確認してください。"
          exit 1

      - name: 実行日を記録して自動コミット (60日タイマー対策・1日1回だけ)
        run: |
          # 日付だけを書くので、同じ日の2回目・3回目は差分なし → コミットしない
          echo "Last keepalive run: $(date -u '+%Y-%m-%d') UTC" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --staged --quiet; then
            echo "本日は記録済み。コミットをスキップ。"
          else
            # [skip ci] を付けて Vercel の無駄な再デプロイを防ぐ
            git commit -m "chore: keepalive $(date -u '+%Y-%m-%d') [skip ci]"
            git push
            echo "✅ .keepalive を更新してpush。60日タイマーをリセット。"
          fi
