<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ログイン | 我が家マネー</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-screen">
    <div class="auth-card">
      <h1 class="auth-title">我が家マネー</h1>
      <p class="auth-subtitle">家計簿アプリへログイン</p>

      <div id="login-view">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">メールアドレス</label>
            <input
              type="email"
              id="email"
              class="form-input"
              required
              autocomplete="email"
              placeholder="example@gmail.com"
            >
            <p class="form-help">入力したメールアドレスにログインリンクを送信します</p>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
            ログインリンクを送信
          </button>
        </form>
      </div>

      <div id="sent-view" style="display:none;">
        <div style="text-align:center; padding: 1rem 0;">
          <div style="font-size: 2.5rem;">📧</div>
          <h2 style="margin: 0.5rem 0; font-size: 1.1rem;">メールを送信しました</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0.5rem 0 1.5rem;">
            <span id="sent-email"></span> にログインリンクを送りました。<br>
            メールのリンクをクリックしてログインしてください。
          </p>
          <button type="button" class="btn btn-ghost btn-block" id="back-btn">
            別のメールで再送信
          </button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase, getUser } from '/js/supabase.js';
    import { toast, withErrorToast } from '/js/utils.js';

    // 既にログイン済みなら dashboard へ
    (async () => {
      const user = await getUser();
      if (user) window.location.replace('/dashboard.html');
    })();

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const loginView = document.getElementById('login-view');
    const sentView = document.getElementById('sent-view');
    const sentEmail = document.getElementById('sent-email');
    const backBtn = document.getElementById('back-btn');

    form.addEventListener('submit', withErrorToast(async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> 送信中...';

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: window.location.origin + '/dashboard.html',
        },
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'ログインリンクを送信';

      if (error) throw error;

      sentEmail.textContent = email;
      loginView.style.display = 'none';
      sentView.style.display = 'block';
      toast('メールを送信しました', 'success');
    }));

    backBtn.addEventListener('click', () => {
      loginView.style.display = 'block';
      sentView.style.display = 'none';
    });
  </script>
</body>
</html>
